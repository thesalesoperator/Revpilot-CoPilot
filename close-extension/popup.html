<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RevPilot Close Co-Pilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* RevPilot Design System Variables */
    :root {
      /* Brand Accent (Teal) */
      --accent: #5eead4;
      --accent-hover: #4fd1c5;
      --accent-light-bg: rgba(94, 234, 212, 0.1);
      --accent-border: rgba(94, 234, 212, 0.3);
      --accent-focus: rgba(94, 234, 212, 0.5);

      /* Backgrounds (Dark) */
      --background: #0a0a0f;
      --background-secondary: #111118;
      --background-tertiary: #18181f;

      /* Text */
      --foreground: #f0f0f5;
      --foreground-muted: #a0a0b0;
      --foreground-dim: #6b6b7b;

      /* Borders & Effects */
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(94, 234, 212, 0.3);

      /* Glassmorphism */
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

      /* Error */
      --error: #f87171;
      --error-bg: rgba(239, 68, 68, 0.1);
      --error-border: rgba(239, 68, 68, 0.2);

      /* Radius */
      --radius-sm: 4px;
      --radius: 8px;
      --radius-lg: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
    }

    .popup-container {
      padding: 20px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--accent-border);
    }

    .logo {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(94, 234, 212, 0.25);
    }

    .logo svg {
      width: 24px;
      height: 24px;
      color: var(--background);
    }

    .title h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      letter-spacing: -0.02em;
    }

    .title p {
      font-size: 12px;
      color: var(--foreground-dim);
    }

    /* Login Form */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-form.hidden {
      display: none;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
      color: var(--foreground-muted);
    }

    .form-group input {
      background: var(--background-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input:focus {
      border-color: var(--accent-focus);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
    }

    .form-group input::placeholder {
      color: var(--foreground-dim);
    }

    .btn-primary {
      background: var(--accent);
      color: var(--background);
      border: none;
      border-radius: var(--radius);
      padding: 12px;
      font-weight: 600;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--foreground-muted);
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--glass-bg);
      color: #fff;
      border-color: var(--accent-border);
    }

    .error-message {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--error);
      display: none;
    }

    .error-message.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logged In State */
    .logged-in {
      display: none;
    }

    .logged-in.show {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    .user-info {
      background: var(--accent-light-bg);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 16px;
    }

    .user-email {
      font-size: 14px;
      color: #fff;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .user-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--accent);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Toggle Section */
    .toggle-section {
      margin-bottom: 16px;
    }

    .toggle-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--background-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn:hover {
      border-color: var(--accent-border);
    }

    .toggle-btn.active {
      border-color: var(--accent);
      background: var(--accent-light-bg);
    }

    .toggle-btn .label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-weight: 500;
    }

    .toggle-btn .icon {
      font-size: 18px;
    }

    .toggle-indicator {
      width: 40px;
      height: 22px;
      background: #374151;
      border-radius: 11px;
      position: relative;
      transition: background 0.2s ease;
    }

    .toggle-indicator::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      background: var(--foreground-muted);
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .toggle-btn.active .toggle-indicator {
      background: var(--accent);
    }

    .toggle-btn.active .toggle-indicator::after {
      left: 21px;
      background: var(--background);
    }

    /* Organization Selector */
    .org-selector {
      margin-bottom: 16px;
    }

    .org-selector label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--foreground-muted);
      margin-bottom: 6px;
    }

    .org-select-wrapper {
      position: relative;
    }

    .org-select {
      width: 100%;
      background: var(--background-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 36px 12px 14px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      appearance: none;
      outline: none;
      transition: all 0.2s ease;
    }

    .org-select:focus {
      border-color: var(--accent-focus);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
    }

    .org-select option {
      background: var(--background-secondary);
      color: #fff;
      padding: 10px;
    }

    .org-select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--foreground-dim);
    }

    .org-select-arrow svg {
      width: 16px;
      height: 16px;
    }

    .no-orgs-message {
      font-size: 12px;
      color: var(--foreground-dim);
      padding: 12px;
      background: var(--glass-bg);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      text-align: center;
    }

    /* Quick Actions */
    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      color: var(--foreground-muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }

    .action-btn:hover {
      background: var(--glass-bg);
      color: #fff;
      border-color: var(--accent-border);
      transform: translateX(2px);
    }

    .action-btn .icon {
      font-size: 16px;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: var(--background-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .stat-card:hover {
      border-color: var(--accent-border);
    }

    .stat-number {
      display: block;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--foreground-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Footer */
    .footer {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      font-size: 12px;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer-text {
      font-size: 11px;
      color: var(--foreground-dim);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
      <div class="title">
        <h1>Close CRM Co-Pilot</h1>
        <p>AI-powered sales assistant</p>
      </div>
    </div>

    <!-- Login Form -->
    <div class="login-form" id="loginForm">
      <div class="error-message" id="errorMessage"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="your@email.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" />
      </div>

      <button class="btn-primary" id="loginBtn">Sign In</button>

      <div class="footer">
        <a href="https://revpilot-copilot.netlify.app/signup" target="_blank">
          Don't have an account? Sign up
        </a>
      </div>
    </div>

    <!-- Logged In State -->
    <div class="logged-in" id="loggedIn">
      <div class="user-info">
        <div class="user-email" id="userEmail">user@example.com</div>
        <div class="user-status">
          <span class="status-dot"></span>
          <span>Connected to RevPilot</span>
        </div>
      </div>

      <!-- Organization Selector -->
      <div class="org-selector" id="orgSelector">
        <label for="orgSelect">Organization</label>
        <div class="org-select-wrapper">
          <select class="org-select" id="orgSelect">
            <option value="">Personal (No Organization)</option>
          </select>
          <span class="org-select-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="toggle-section">
        <button class="toggle-btn" id="toggleOverlay">
          <span class="label">
            <span class="icon">💬</span>
            <span>AI Assistant</span>
          </span>
          <span class="toggle-indicator"></span>
        </button>
      </div>

      <div class="stats">
        <div class="stat-card">
          <span class="stat-number" id="keywordCount">0</span>
          <span class="stat-label">Keywords</span>
        </div>
        <div class="stat-card">
          <span class="stat-number" id="chatCount">0</span>
          <span class="stat-label">Chats Today</span>
        </div>
      </div>

      <div class="quick-actions">
        <button class="action-btn" id="manageKeywords">
          <span class="icon">🏷️</span>
          <span>Manage Keywords</span>
        </button>
        <button class="action-btn" id="openDashboard">
          <span class="icon">📊</span>
          <span>Open Dashboard</span>
        </button>
      </div>

      <button class="btn-secondary" id="logoutBtn">Sign Out</button>

      <div class="footer">
        <a href="https://revpilot-copilot.netlify.app/settings" target="_blank">
          RevPilot Settings
        </a>
        <p class="footer-text">Close CRM Co-Pilot v1.0.0</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
